name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: canonical/desktop-engineering/gh-actions/flutter/setup@e1069c189573b3525a60f54c5107ea3264f80805
      - run: melos generate
      - run: melos gen-l10n
      - run: melos analyze --fatal-infos

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: canonical/desktop-engineering/gh-actions/flutter/setup@e1069c189573b3525a60f54c5107ea3264f80805
      - run: melos format:exclude

  l10n:
    runs-on: ubuntu-24.04
    steps:
      - uses: canonical/desktop-engineering/gh-actions/flutter/setup@e1069c189573b3525a60f54c5107ea3264f80805
      - run: melos generate
      - run: melos gen-l10n
      - run: melos sync-desktop-titles
      - name: Check for outdated l10n
        if: github.event_name == 'pull_request'
        run: ./scripts/check-outdated-files.sh
      - name: Create PR
        if: github.event_name == 'push'
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: |
            '**/l10n/*.dart'
            packages/app_center/assets/app-center.desktop
            packages/app_center/assets/app-center-packagekit.desktop
          title: 'chore: regenerate l10n'
          commit-message: 'chore: regenerate l10n'
          branch: create-pull-request/l10n
          delete-branch: true

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: canonical/desktop-engineering/gh-actions/flutter/setup@e1069c189573b3525a60f54c5107ea3264f80805
      - run: sudo apt update && sudo apt install -y lcov
      - run: melos generate
      - run: melos gen-l10n
      - run: melos coverage
      - uses: codecov/codecov-action@v5
        with:
          token: ${{secrets.CODECOV_TOKEN}}

      - name: Process coverage output
        run: |
          mkdir coverage
          for package in app_center app_center_ratings_client; do
            pushd packages/$package
            sed -i "s|lib/|$(pwd)/lib/|g" coverage/lcov.info
            mv coverage/lcov.info ../../coverage/$package.info
            popd
          done

      - name: Run TICS analysis
        if: github.event_name == 'push'
        uses: tiobe/tics-github-action@v3
        with:
          mode: qserver
          project: app-center
          viewerUrl: https://canonical.tiobe.com/tiobeweb/TICS/api/cfg?name=GoProjects
          ticsAuthToken: ${{ secrets.TICSAUTHTOKEN }}
          installTics: true
