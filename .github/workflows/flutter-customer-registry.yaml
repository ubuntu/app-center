name: Flutter customer registry

# This workflow is intentionally not a required branch-protection check. It runs
# the Flutter Customer Test Registry flow for each pull request against the latest
# Flutter main SDK. A failure shows as a red check but must not block merging;
# the normal CI keeps testing with the App Center pinned SDK in `.fvmrc`.
on:
  pull_request:

concurrency:
  group: flutter-customer-registry-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter-main:
    name: Flutter main customer tests
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      # Install only FVM. The wrapper selects Flutter main itself, so the pinned
      # SDK is never bootstrapped in the checkout the run copies.
      - name: Install FVM
        run: |
          curl -fsSL https://fvm.app/install.sh | bash -s -- 4.3.1
          echo "$HOME/fvm/bin" >> "$GITHUB_PATH"
      - name: Run Flutter Customer Test Registry flow
        env:
          REGISTRY_EVIDENCE_DIR: ${{ runner.temp }}/flutter-registry-evidence
        run: bash scripts/run_flutter_registry_ci.sh
      - name: Upload registry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-registry-evidence
          path: ${{ runner.temp }}/flutter-registry-evidence
          if-no-files-found: warn
